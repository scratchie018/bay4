<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts/fonts.css"><style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#06070a}
.bg{position:absolute;inset:0 -140px 0 0;transform:translateX(150px) scale(1.04);background:url(thumb-bg.png) 62% 50%/cover;filter:saturate(1.15) contrast(1.06)}

.stripe{position:absolute;left:0;right:0;top:0;height:22px;background:repeating-linear-gradient(-45deg,#f0a23b 0 26px,#111 26px 52px)}
.logo{position:absolute;left:54px;top:92px;font:400 150px/0.88 "Saira Stencil One",Impact,sans-serif;color:#f3ede1;text-shadow:0 8px 0 rgba(0,0,0,.6),0 0 40px rgba(0,0,0,.5);transform:rotate(-3deg);transform-origin:left}

.logo .b{color:#f0a23b}
.tag{position:absolute;left:62px;top:430px;font:700 30px "Chakra Petch",sans-serif;letter-spacing:.3em;color:#f3ede1;text-shadow:0 2px 8px #000}
.badge{position:absolute;left:62px;bottom:52px;font:700 34px "Chakra Petch",sans-serif;letter-spacing:.12em;color:#111;background:#f0a23b;padding:8px 22px 6px;transform:skewX(-10deg);box-shadow:0 6px 0 rgba(0,0,0,.5)}
</style></head><body><div class="bg"></div><div class="shade"></div><div class="stripe"></div>
